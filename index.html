<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechnoStudio</title>
<meta name="description" content="Ateliers de technologie au format de la charte : feuilles, ressources, synthèse, évaluation ; simulations et programmation de cartes. Hors ligne, ou connecté à la Centrale élèves avec le code élève.">
<meta name="theme-color" content="#2F57A1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--APP-->
<!-- Barre du haut commune aux applications (NetSim, TechnoStudio, Établi 3D) :
     logo et menus · annuler / rétablir · widget de l'élève (← et identifiant) · atelier en cours au centre · thème et réglages -->
<header class="menubar">
  <nav id="menus" role="menubar" aria-label="Menus"></nav>
  <div class="tb-hist" role="group" aria-label="Historique">
    <button class="tb-ico" type="button" id="bAnnuler" title="Annuler (Ctrl+Z)" aria-label="Annuler" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="tb-ico" type="button" id="bRetablir" title="Rétablir (Ctrl+Y)" aria-label="Rétablir" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="tbres tbid" id="widgetCentrale"><button class="tbid-moi" id="bCentrale" type="button" data-sync></button></div>
  <div class="tb-centre" id="tbAtelier"></div>
  <div class="mb-right">
    <button class="tb-ico" type="button" data-theme-btn aria-label="Changer de thème"></button>
    <button class="tb-ico" type="button" id="bReglages" aria-haspopup="true" aria-expanded="false" aria-label="Réglages" title="Réglages"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<div id="workspace">
  <div id="stage" class="stage"></div>
  <div id="dock" role="toolbar" aria-label="Panneaux" hidden></div>
</div>
<noscript><p style="padding:2rem">TechnoStudio a besoin de JavaScript pour fonctionner.</p></noscript>
<!--/APP-->
<!--SCRIPTS-->
<script src="js/core.js"></script>
<script src="js/gift.js"></script>
<script src="js/descriptor.js"></script>
<script src="js/passerelle.js"></script>
<script src="js/activities.js"></script>
<script src="js/circuit.js"></script>
<script src="js/blocks.js"></script>
<script src="js/sheet.js"></script>
<script src="js/mesures.js"></script>
<script src="js/ressources.js"></script>
<script src="js/code.js"></script>
<script src="js/mblock.js"></script>
<script src="js/robot-img.js"></script>
<script src="js/robot.js"></script>
<script src="js/demos.js"></script>
<script src="js/demos2.js"></script>
<script src="js/flash.js"></script>
<script src="js/centrale.js"></script>
<script src="js/panels.js"></script>
<script src="js/editor.js"></script>
<script src="js/editor2.js"></script>
<script src="js/app.js"></script>
<!--/SCRIPTS-->
<script>TL.app.start();</script>
</body>
</html>
