# Forge des communs numériques éducatifs : publie l'appli avec GitLab Pages
# (adresse affichée dans Déployer → Pages). Le dépôt y est copié depuis GitHub
# par le workflow .github/workflows/miroirs.yml.
pages:
  stage: deploy
  image: node:20-alpine
  script:
    # comme GitHub Pages (.github/workflows/pages.yml) : centrale.json, ateliers.json et le fichier unique sont refaits
    # à partir du code et du dossier ateliers/, puis publiés avec lui (sinon les ateliers publiés manquent sur la forge)
    - node tools/centrale-json.js && node tools/build.js
    - mkdir -p public
    - cp -r index.html manifest.webmanifest sw.js .nojekyll centrale.json ateliers.json ateliers PASSERELLE.md css js vendor icons dist docs public/
    - rm -f public/dist/artifact.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
