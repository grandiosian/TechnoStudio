# Publie l'application sur GitHub Pages (https://grandiosian.github.io/TechnoStudio/) à chaque envoi sur main.
# Réglage GitHub une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer le site (l'appli seule, sans serveurs ni tests)
        run: |
          # centrale.json, ateliers.json et le fichier unique sont refaits à partir du code et du dossier ateliers/ :
          # un atelier ajouté dans ateliers/ est publié même si l'on n'a pas relancé les outils.
          node tools/centrale-json.js && node tools/build.js
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll centrale.json ateliers.json ateliers PASSERELLE.md css js vendor icons dist docs _site/
          rm -f _site/dist/artifact.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
