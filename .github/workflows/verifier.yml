# Vérifie TechnoStudio à chaque envoi : syntaxe, ateliers conformes au descripteur, centrale.json,
# téléversement Arduino (STK500) contre un faux bootloader, règles du serveur de compilation,
# et que le fichier unique dist/technostudio-autonome.html est à jour.
name: Vérifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JavaScript
        run: for f in js/*.js sw.js serveur-compilation/serveur.js pont/pont.js tools/*.js tests/*.js; do node --check "$f"; done
      - name: Ateliers intégrés conformes au descripteur
        run: node tools/verifier-ateliers.js
      - name: Téléversement Arduino (STK500, faux bootloader)
        run: node tests/stk500.test.js
      - name: Règles du serveur de compilation
        run: node tests/serveur-regles.test.js
      - name: Descripteur centrale.json à jour et conforme (passerelle.atelier v1)
        run: |
          node tools/centrale-json.js
          git diff --quiet -- centrale.json || { echo "::error::centrale.json n'est pas à jour : lancez node tools/centrale-json.js"; exit 1; }
          npm i --no-save --silent ajv@8.17.1
          node tools/valider-centrale-json.js centrale.json docs/passerelle-atelier/modele-centrale.json
      - name: Fichier unique à jour
        run: |
          node tools/build.js
          git diff --quiet -- dist/technostudio-autonome.html || { echo "::error::dist/technostudio-autonome.html n'est pas à jour : lancez node tools/build.js"; exit 1; }

  # Compilation réelle avec arduino-cli, exactement comme sur le serveur de la Centrale :
  # le script d'installation du serveur est lancé sur la machine GitHub, puis les programmes
  # produits par les blocs (tests/croquis) sont compilés pour chaque carte.
  compilation-reelle:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer le compilateur (script du serveur)
        run: |
          mkdir -p ~/technostudio-compilation
          cp -r serveur-compilation ~/technostudio-compilation/code
          bash ~/technostudio-compilation/code/installer-centrale.sh > installation.log 2>&1 || { echo "::error title=installation::$(tail -c 3000 installation.log | sed -e ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          echo "::notice title=installation::$(grep -E '^(== |arduino-cli|Version|espace|déjà|!!)' installation.log | tail -c 3000 | sed -e ':a;N;$!ba;s/\n/%0A/g')"
      - name: Compiler les programmes des blocs
        run: bash tests/compiler-croquis.sh ~/technostudio-compilation/code ~/technostudio-compilation/travail
