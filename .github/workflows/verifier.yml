# Vérifie TechnoStudio à chaque envoi : syntaxe, ateliers conformes au descripteur, centrale.json,
# téléversement Arduino (STK500) contre un faux bootloader, règles du serveur de compilation,
# et que le fichier unique dist/technostudio-autonome.html est à jour.
name: Vérifier

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JavaScript
        run: for f in js/*.js sw.js serveur-compilation/serveur.js pont/pont.js tools/*.js tests/*.js; do node --check "$f"; done
      - name: Ateliers intégrés conformes au descripteur
        run: node tools/verifier-ateliers.js
      - name: Téléversement Arduino (STK500, faux bootloader)
        run: node tests/stk500.test.js
      - name: Règles du serveur de compilation
        run: node tests/serveur-regles.test.js
      - name: Descripteur centrale.json et catalogue ateliers.json à jour et conformes
        run: |
          node tools/centrale-json.js
          # Le site publié les refait de toute façon (pages.yml) : un simple avertissement si le dépôt est en retard
          git diff --quiet -- centrale.json ateliers.json || echo "::warning::centrale.json ou ateliers.json n'est pas à jour dans le dépôt : lancez node tools/centrale-json.js (le site publié est refait automatiquement)"
          npm i --no-save --silent ajv@8.17.1
          node tools/valider-centrale-json.js centrale.json docs/passerelle-atelier/modele-centrale.json
      - name: Fichier unique à jour
        run: |
          node tools/build.js
          git diff --quiet -- dist/technostudio-autonome.html || echo "::warning::dist/technostudio-autonome.html n'est pas à jour dans le dépôt : lancez node tools/build.js (le site publié est refait automatiquement)"

  # Compilation réelle avec arduino-cli, exactement comme sur le serveur de la Centrale :
  # le script d'installation du serveur est lancé sur la machine GitHub, puis les programmes
  # produits par les blocs (tests/croquis) sont compilés pour chaque carte.
  compilation-reelle:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer la chaîne (comme pour le serveur) et l'installer à l'emplacement du serveur
        run: |
          bash serveur-compilation/preparer-chaine.sh ~/chaine > preparation.log 2>&1 || { echo "::error title=préparation::$(tail -c 3000 preparation.log | sed -e ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          echo "::notice title=préparation::$(grep -E 'Ko →|^[0-9.]+[KMG]\s' preparation.log | tail -c 3000 | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          mkdir -p ~/bin ~/.arduino15 ~/Arduino ~/technostudio-compilation
          cp ~/chaine/bin/arduino-cli ~/bin/ && cp -r ~/chaine/arduino15/. ~/.arduino15/ && cp -r ~/chaine/Arduino/. ~/Arduino/
          rm -rf ~/chaine
          cp -r serveur-compilation ~/technostudio-compilation/code
          bash ~/technostudio-compilation/code/installer-centrale.sh --chaine-copiee > installation.log 2>&1 || { echo "::error title=installation::$(tail -c 3000 installation.log | sed -e ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
      - name: Compiler les programmes des blocs
        run: bash tests/compiler-croquis.sh ~/technostudio-compilation/code ~/technostudio-compilation/travail
